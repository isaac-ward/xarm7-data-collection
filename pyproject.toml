[project]
name = "swoosh-collect"
version = "0.1.0"
description = "Xbox-controller teleoperation and world-model data collection for Swoosh's right xArm 7"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pyyaml",
  "ruamel.yaml",        # comment-preserving round-trip for conf/collect.yaml
  "opencv-python-headless",
  "imageio[ffmpeg]",
  "evdev",                 # wired Xbox pad via /dev/input, no ROS
  "rich",                  # live TUI; no event loop, so it cannot block the servo loop
  "pyarrow",               # LeRobot v2.1 parquet export
  # Pinned to a release tag, NOT master: master carries a broken `XArm-move-teach`
  # gitlink with no .gitmodules URL, which makes uv's submodule init (and so the
  # Docker build) fail. v1.18.4 is the latest clean release with xarm.wrapper.XArmAPI.
  # (Learned from sisl/manipulation-mono.)
  "xarm-python-sdk @ git+https://github.com/xArm-Developer/xArm-Python-SDK.git@v1.18.4",
]

[project.scripts]
swoosh-collect   = "swoosh_collect.collect:main"        # teleop + record
swoosh-sanity    = "swoosh_collect.sanity:main"         # arm bring-up check
swoosh-cameras   = "swoosh_collect.cameras:main"        # discover + name cameras by USB path
swoosh-campaign  = "swoosh_collect.campaign:main"       # create / list campaigns
swoosh-summarize = "swoosh_collect.summarize:main"      # per-run summary mp4 + plots
swoosh-export    = "swoosh_collect.export_lerobot:main" # raw -> LeRobot v2.1 @ 30 Hz
swoosh-validate  = "swoosh_collect.validate:main"       # check a run for the known failure modes

[tool.uv]
package = true
